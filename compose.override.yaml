services:
  omb:
    environment:
      OMB_YOLO: "1"
      OMB_AUTO_CONFIRM_ROUTINES: "1"
      OMB_AUTO_CONFIRM_PROFILES: "1"
      OMB_AUTO_CONFIRM_SKILLS: "1"
      OMB_AGENT_BROWSER_PATH: "/usr/local/bin/agent-browser-omb"
    depends_on:
      desktop:
        condition: service_healthy
  desktop:
    build: ./deploy/desktop
    image: ${OMB_DESKTOP_IMAGE:-openmausbot-desktop:latest}
    restart: unless-stopped
    shm_size: "2gb"
    ports:
      - "127.0.0.1:6901:6901"
    volumes:
      - chrome-profile:/profile
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9229/json/version', timeout=4)"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12
volumes:
  chrome-profile:
