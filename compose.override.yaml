services:
  omb:
    environment:
      OMB_YOLO: "1"
      OMB_AUTO_CONFIRM_ROUTINES: "1"
      OMB_AUTO_CONFIRM_PROFILES: "1"
      OMB_AUTO_CONFIRM_SKILLS: "1"
      OMB_AGENT_BROWSER_PATH: "/usr/local/bin/agent-browser-omb"
      OMB_STATIC_DIR: "/src/dist"
      OMB_SRC_DIR: "/src"
    volumes:
      # Fork repo (host checkout) -> the server boots from it; updates are
      # git pull + restart, no image rebuild.
      - ./:/src
      # pnpm symlinks cannot live on the Windows bind mount.
      - omb-node-modules:/src/node_modules
      # Host SSH keys (read-only) so the bot can git pull/push itself.
      # repo-start.sh copies the private key to a 0600 file on boot.
      - ${USERPROFILE}/.ssh:/mnt/host-ssh:ro
    ports:
      # noVNC viewer of the desktop sidecar (shares omb's netns).
      - "127.0.0.1:6901:6901"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8799/api/health', { signal: AbortSignal.timeout(4000) }).then(async r => { if (!r.ok || !(await r.text()).includes('openmausbot')) process.exit(1); }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 10m
      retries: 5
    depends_on:
      desktop:
        condition: service_healthy
  desktop:
    build: ./deploy/desktop
    image: ${OMB_DESKTOP_IMAGE:-openmausbot-desktop:latest}
    # Share omb's network namespace (same as caddy): current Chrome ignores
    # --remote-debugging-address and binds CDP to loopback only, so omb must
    # reach it as 127.0.0.1:9229. Ports are published on omb instead.
    network_mode: service:omb
    restart: unless-stopped
    shm_size: "2gb"
    volumes:
      - chrome-profile:/profile
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9229/json/version', timeout=4)"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12
volumes:
  omb-node-modules:
  chrome-profile:
